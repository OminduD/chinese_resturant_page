name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          publish_branch: gh-pages

# Notes:
# - This workflow triggers on pushes to `main`. Change the branch name if your default branch is `master`.
# - It publishes the repository root to the `gh-pages` branch. If you prefer `docs/`, set `publish_dir: ./docs`.
